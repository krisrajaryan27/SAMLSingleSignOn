storepass=changeit
keypass=changeit
certificate.alias=tomcat

# Services
entityID=https://172.29.2.8:8443/TalentPool/
nameID.formats=urn:oasis:names:tc:SAML:2.0:nameid-format:persistent \
  urn:oasis:names:tc:SAML:2.0:nameid-format:transient 
  

assertion.consumer.service=https://172.29.2.8:8443/TalentPool/assertion-consumer-service

single.logout.service=https://172.29.2.8:8443/TalentPool/logout
com.talentpool.plugin.samlauth.saml_url_servlet_prefix=/TalentPool
com.talentpool.plugin.samlauth.singlelogout=true
com.talentpool.plugin.samlauth.spnamequalifier=

idp_directory_location=D:/var/tmp

#urn:oasis:names:tc:SAML:2.0:ac:classes:Password
authnContextClassRef=urn:federation:authentication:windows
#urn:federation:authentication:windows